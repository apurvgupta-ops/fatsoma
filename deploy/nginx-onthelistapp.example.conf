# Reverse-proxy: PM2 apps on any host behind nginx.
# Copy to /etc/nginx/sites-available/, symlink sites-enabled, nginx -t && systemctl reload nginx.
#
# PM2 (repo root): api → :3016, web → :3017, admin → :3018  (all on 0.0.0.0)
#
# DNS (A records → server public IP):
#   onthelistapp.co.uk, www.onthelistapp.co.uk  → web
#   admin.onthelistapp.co.uk                     → admin
#   api.onthelistapp.co.uk                       → API
#
# TLS: certbot certonly --nginx -d onthelistapp.co.uk -d www.onthelistapp.co.uk \
#       -d admin.onthelistapp.co.uk -d api.onthelistapp.co.uk

upstream fatsoma_api {
    server 127.0.0.1:3016;
    keepalive 32;
}

upstream fatsoma_web {
    server 127.0.0.1:3017;
    keepalive 32;
}

upstream fatsoma_admin {
    server 127.0.0.1:3018;
    keepalive 32;
}

# --- API (api.onthelistapp.co.uk → :3016) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.onthelistapp.co.uk;

    ssl_certificate     /etc/letsencrypt/live/onthelistapp.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onthelistapp.co.uk/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://fatsoma_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- Public site (onthelistapp.co.uk → :3017) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name onthelistapp.co.uk www.onthelistapp.co.uk;

    ssl_certificate     /etc/letsencrypt/live/onthelistapp.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onthelistapp.co.uk/privkey.pem;

    location / {
        proxy_pass http://fatsoma_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- Admin panel (admin.onthelistapp.co.uk → :3018) ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.onthelistapp.co.uk;

    ssl_certificate     /etc/letsencrypt/live/onthelistapp.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onthelistapp.co.uk/privkey.pem;

    location / {
        proxy_pass http://fatsoma_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name onthelistapp.co.uk www.onthelistapp.co.uk admin.onthelistapp.co.uk api.onthelistapp.co.uk;
    return 301 https://$host$request_uri;
}
